<!DOCTYPE html>
<head>
   <meta charset="UTF-8">
   <title>Hello World</title>
   <link rel="stylesheet" href="style.css">
</head>

<header class="header">
  <div class="header-container">
    <a href="#" class="logo-link">
      <img src="img/fooddie.svg" alt="fooddie" class="logo-img">
    </a>

    <div class="search-container">
      <input type="text" class="search-bar" placeholder="Buscar...">
    </div>

    <div class="header-spacer"></div>

    <div class="action-icons">
      <button class="icon-btn">
        <img src="img/icon-share.svg" alt="Compartir" class="nav-icon">
      </button>
      <button class="icon-btn">
        <img src="img/icon-history.svg" alt="Historial" class="nav-icon">
      </button>
      <button class="icon-btn">
        <img src="img/icon-notifications.svg" alt="Avisos" class="nav-icon">
      </button>
      <button class="icon-btn">
        <img src="img/icon-darkmode.svg" alt="Modo nocturno" class="nav-icon">
      </button>
    </div>

    <div class="user-block">
      <span class="welcome-text">Bienvenido, usuario/a</span>
      <button class="burger-btn">
        <img src="img/burger.svg" alt="Menú" class="nav-icon">
      </button>
      <img src="img/profile-avatar.jpg" alt="Foto de perfil" class="profile-img">
    </div>
  </div>
</header>

<body>
  <div class="card">
    <h1>Hello, World!</h1>
    <p>This is my first styled web page.</p>
  </div>
</body>
</html>
